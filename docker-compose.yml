services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  parcel-service:
    build: ./parcel-service
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/huertos_parcels
      MONITORING_URL: http://monitoring-service:8082
    depends_on:
      mongodb:
        condition: service_healthy

  monitoring-service:
    build: ./monitoring-service
    ports:
      - "8082:8082"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/huertos_monitoring
      PARCELS_URL: http://parcel-service:8081
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
